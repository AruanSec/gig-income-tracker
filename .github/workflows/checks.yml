name: Checks
on:
  push:
    branches: [main, staging, 'feature/**']
  pull_request:
    branches: [main, staging]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: gig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gig_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx tsx --test tests/moneyMigration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/gig_test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:api
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/gig_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:security
      - run: npm run test:deployment
