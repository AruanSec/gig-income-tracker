services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: tax_mileage_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tax_mileage_db}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      # Persistent PostgreSQL data volume
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-app-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tax_mileage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Main Application Service
  tax-mileage-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tax_mileage_tracker
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - TRUST_PROXY=${TRUST_PROXY:-}
      - DATABASE_URL=postgresql://gig_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-tax_mileage_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=gig_app
      - POSTGRES_PASSWORD=${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-tax_mileage_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(10000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 12s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
